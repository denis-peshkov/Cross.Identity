# Direct back-merge: merge `master` into `dev` and push.
#
# No PR, no build gate — keeps `dev` in sync after hotfixes/releases on `master`.
# On merge conflicts the job fails (resolve locally / open a manual PR).
#
# Push uses TAGTOKEN (owner/admin PAT) to bypass "Protect dev" ruleset.
# Do not pass TAGTOKEN into actions/checkout `token:` — an empty secret becomes
# an empty string and checkout fails with "Input required and not supplied: token".
# GITHUB_TOKEN (github-actions[bot]) cannot be added as Integration bypass on personal repos.

name: Back-merge master to dev

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: backmerge-master-to-dev
  cancel-in-progress: false

jobs:
  back-merge:
    name: Merge master into dev
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge master into dev and push
        env:
          TAGTOKEN: ${{ secrets.TAGTOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${TAGTOKEN}" ]; then
            echo "::error::Repository secret TAGTOKEN is missing or empty. Back-merge needs an owner PAT (repo scope) to push past the protect-dev ruleset. See .github/rulesets/README.md"
            exit 1
          fi

          git fetch origin master dev

          if git merge-base --is-ancestor origin/master origin/dev; then
            echo "dev already contains master — nothing to back-merge."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -B dev origin/dev

          SHORT_SHA="$(git rev-parse --short origin/master)"

          if ! git merge --no-ff --no-edit -m "chore: back-merge master (${SHORT_SHA}) into dev" origin/master; then
            git merge --abort || true
            echo "::error::Back-merge master → dev has conflicts. Resolve locally and push to dev, or open a manual PR."
            exit 1
          fi

          git remote set-url origin "https://x-access-token:${TAGTOKEN}@github.com/${{ github.repository }}.git"
          git push origin dev

          echo "Back-merged master (${SHORT_SHA}) into dev and pushed."
