# Direct back-merge: merge `master` into `dev` and push (no PR, no build wait).
#
# Protect-dev stays strict (PR + required check "build"). github-actions[bot]
# (GITHUB_TOKEN) cannot push past that. Push uses TAGTOKEN — owner PAT with
# repo scope — which inherits Repository admin bypass on the ruleset
# (same pattern as tag push in dotnet.yml).
#
# Checkout uses GITHUB_TOKEN only. Never put TAGTOKEN into actions/checkout
# `token:` — an empty/missing secret becomes "" and fails with
# "Input required and not supplied: token".

name: Back-merge master to dev

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: backmerge-master-to-dev
  cancel-in-progress: false

jobs:
  back-merge:
    name: Merge master into dev
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge master into dev and push
        env:
          TAGTOKEN: ${{ secrets.TAGTOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${TAGTOKEN}" ]; then
            echo "::error::Secret TAGTOKEN is missing or empty. Protect-dev requires PR+build for normal pushes; back-merge bypasses via owner PAT. Create a classic PAT (repo scope) for the repository owner and add it as Actions secret TAGTOKEN (same secret as tag push in dotnet.yml)."
            exit 1
          fi

          git fetch origin master dev

          if git merge-base --is-ancestor origin/master origin/dev; then
            echo "dev already contains master — nothing to back-merge."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -B dev origin/dev

          SHORT_SHA="$(git rev-parse --short origin/master)"

          if ! git merge --no-ff --no-edit -m "chore: back-merge master (${SHORT_SHA}) into dev" origin/master; then
            git merge --abort || true
            echo "::error::Back-merge master → dev has conflicts. Resolve locally and push to dev, or open a manual PR."
            exit 1
          fi

          git remote set-url origin "https://x-access-token:${TAGTOKEN}@github.com/${{ github.repository }}.git"
          git push origin dev

          echo "Back-merged master (${SHORT_SHA}) into dev and pushed."
