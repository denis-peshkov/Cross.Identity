name: Question
description: Usage question, integration help, or unclear behavior — not a confirmed bug.
body:
  - type: markdown
    attributes:
      value: |
        Use this template when you are **not sure** the behavior is a bug, or you need guidance integrating Cross.Identity.

        If you have a **reproducible defect**, use **Bug report** instead.

        **Do not post** secrets, license keys, or live tokens.

  - type: checkboxes
    id: verification
    attributes:
      label: Verification
      options:
        - label: I searched [issues](https://github.com/denis-peshkov/Cross.Identity/issues?q=is%3Aissue) and [FLOWS.md](https://github.com/denis-peshkov/Cross.Identity/blob/dev/Cross.Identity/FLOWS.md) first.
          required: true

  - type: input
    id: package-version
    attributes:
      label: Cross.Identity NuGet version (if applicable)
      placeholder: "10.2.1"
    validations:
      required: false

  - type: textarea
    id: question
    attributes:
      label: Your question
      description: What are you trying to achieve? Include flow/operation and TFM if relevant.
    validations:
      required: true

  - type: textarea
    id: tried
    attributes:
      label: What you already tried
      description: Config keys (redacted values), docs links, code snippets.
    validations:
      required: false
