name: Question
description: Usage question, integration help, or unclear behavior — not a confirmed bug.
body:
  - type: markdown
    attributes:
      value: |
        Use this template when you are **not sure** the behavior is a bug, or you need guidance integrating Cross.CQRS.

        If you have a **reproducible defect**, use **Bug report** instead.

        **Do not post** secrets, license keys, or live tokens.

  - type: checkboxes
    id: verification
    attributes:
      label: Verification
      options:
        - label: I searched [issues](https://github.com/denis-peshkov/Cross.CQRS/issues?q=is%3Aissue) and the [README](https://github.com/denis-peshkov/Cross.CQRS/blob/master/README.md) first.
          required: true

  - type: input
    id: package-version
    attributes:
      label: Cross.CQRS NuGet version (if applicable)
      placeholder: "x.y.z"
    validations:
      required: false

  - type: textarea
    id: question
    attributes:
      label: Your question
      description: What are you trying to achieve? Include TFM and registration snippet if relevant.
    validations:
      required: true

  - type: textarea
    id: tried
    attributes:
      label: What you already tried
      description: Config keys (redacted values), docs links, code snippets.
    validations:
      required: false
