<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Password changed</title>
</head>
<body style="margin:0;padding:0;background:#f5f7fb;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f5f7fb;">
  <tr>
    <td align="center" style="padding:24px;">
      <table role="presentation" width="600" style="max-width:600px;background:#ffffff;border-radius:12px;overflow:hidden;box-shadow:0 2px 10px rgba(16,24,40,.08);">
        <tr>
          <td style="padding:24px 32px;background:#0d6efd;color:#fff;font-family:Segoe UI,Roboto,Arial,sans-serif;">
            <table width="100%">
              <tr>
                <td style="font-weight:700;font-size:18px">{{brand}}</td>
                <td align="right" style="font-size:12px;opacity:.9">Account security</td>
              </tr>
            </table>
          </td>
        </tr>
        <tr>
          <td style="padding:28px 32px 8px 32px;font-family:Segoe UI,Roboto,Arial,sans-serif;color:#111827;">
            <h1 style="margin:0 0 12px 0;font-size:20px">Password changed</h1>
            <p style="margin:0 0 16px 0;font-size:14px;color:#374151">
              Your password was changed at <strong>{{changedAt}}</strong> from IP <strong>{{ip}}</strong>.
            </p>
            <p style="margin:0 0 16px 0;font-size:14px;color:#374151">
              If this wasn't you, contact support immediately.
            </p>
          </td>
        </tr>
        <tr>
          <td style="padding:0 32px 28px 32px;font-family:Segoe UI,Roboto,Arial,sans-serif">
            <hr style="border:none;border-top:1px solid #e5e7eb;margin:8px 0 16px 0">
            <p style="margin:0;font-size:12px;color:#9ca3af">Need help? <a href="mailto:{{support}}" style="color:#6b7280;text-decoration:underline">{{support}}</a></p>
            <p style="margin:8px 0 0 0;font-size:11px;color:#9ca3af">© {{year}} {{brand}}. All rights reserved.</p>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
