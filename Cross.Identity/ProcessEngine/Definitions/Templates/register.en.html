<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="x-apple-disable-message-reformatting">
  <meta name="format-detection" content="telephone=no,date=no,address=no,email=no,url=no">
  <title>Welcome</title>
  <style>
    /* unified email shell + autosize */
    html, body { margin:0 !important; padding:0 !important; width:100% !important; }
    * { box-sizing:border-box; -ms-text-size-adjust:100%; -webkit-text-size-adjust:100%; }
    table { border-collapse:separate !important; mso-table-lspace:0pt; mso-table-rspace:0pt; }
    img { border:0; outline:none; text-decoration:none; display:block; max-width:100% !important; height:auto !important; }
    a { overflow-wrap:break-word; }
    .email-shell { width:100% !important; }
    .email-pad { box-sizing:border-box; }
    .email-card {
      width:100% !important;
      max-width:600px !important;
      box-sizing:border-box;
    }
    .email-btn {
      box-sizing:border-box !important;
      max-width:100% !important;
    }
    .email-foot {
      width:100% !important;
      max-width:600px !important;
      box-sizing:border-box;
    }
    @media only screen and (max-width:620px) {
      .email-pad { padding:10px !important; }
      .email-card {
        width:100% !important;
        max-width:100% !important;
        border-radius:0 !important;
      }
      .email-card td { font-size:16px !important; }
      .email-card h1 { font-size:20px !important; margin-bottom:10px !important; }
      .email-btn {
        display:block !important;
        width:100% !important;
        max-width:100% !important;
        box-sizing:border-box !important;
        text-align:center !important;
      }
      .email-foot { width:100% !important; max-width:100% !important; padding-left:10px !important; padding-right:10px !important; }
      .email-code { font-size:24px !important; letter-spacing:2px !important; }
    }
  </style>
</head>
<body style="margin:0;padding:0;background:#f5f7fb;">

<table role="presentation" class="email-shell" style="background:#f5f7fb;width:100%;border-spacing:0;">
  <tr>
    <td class="email-pad" style="padding:24px;box-sizing:border-box;text-align:center;">
      <table role="presentation" class="email-card" style="width:100%;max-width:600px;background:#ffffff;border-radius:12px;overflow:hidden;box-shadow:0 2px 10px rgba(16,24,40,.08);">
        <tr>
          <td style="padding:24px 32px;background:#0d6efd;color:#fff;font-family:Segoe UI,Roboto,Arial,sans-serif;">
            <table role="presentation" style="width:100%;border-collapse:separate;">
              <tr>
                <td style="font-weight:700;font-size:18px">{{brand}}</td>
                <td style="font-size:12px;opacity:.9;text-align:right;">Welcome</td>
              </tr>
            </table>
          </td>
        </tr>
        <tr>
          <td style="padding:28px 32px 8px 32px;font-family:Segoe UI,Roboto,Arial,sans-serif;color:#111827;">
            <h1 style="margin:0 0 12px 0;font-size:20px">Hello, {{fullName}}</h1>
            <p style="margin:0 0 16px 0;font-size:14px;color:#374151">
              Welcome to <strong>{{company}}</strong>. Your account for <strong>{{email}}</strong> is ready.
            </p>
          </td>
        </tr>

        <tr>
          <td style="padding:12px 32px 8px 32px;text-align:center;">
            <a href="{{url}}" class="email-btn" style="display:inline-block;background:#0d6efd;box-sizing:border-box;max-width:100%;color:#fff;text-decoration:none;padding:12px 20px;border-radius:8px;font-family:Segoe UI,Roboto,Arial,sans-serif;font-size:14px;font-weight:600">
              Open account
            </a>
          </td>
        </tr>


        <tr>
          <td style="padding:0 32px 28px 32px;font-family:Segoe UI,Roboto,Arial,sans-serif">
            <hr style="border:none;border-top:1px solid #e5e7eb;margin:8px 0 16px 0">
            <p style="margin:0;font-size:12px;color:#9ca3af">Need help? <a href="mailto:{{supportEmail}}" style="color:#6b7280;text-decoration:underline">{{supportEmail}}</a></p>
            <p style="margin:8px 0 0 0;font-size:11px;color:#9ca3af">© {{year}} {{brand}}. All rights reserved.</p>
          </td>
        </tr>
      </table>
      <div class="email-foot" style="width:100%;max-width:600px;margin-top:12px;font-family:Segoe UI,Roboto,Arial,sans-serif;font-size:12px;color:#6b7280;box-sizing:border-box;">
        If the button doesn’t work, paste this link into your browser:<br><span style="word-break:break-all">{{url}}</span>
      </div>

    </td>
  </tr>
</table>
</body>
</html>
